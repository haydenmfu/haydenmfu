<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Hayden Fu</title>
  <desc id="desc">Warm research-desk header with soft light, ink lines, and sparse data marks.</desc>
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F1E7"/>
      <stop offset="0.55" stop-color="#EFE6D6"/>
      <stop offset="1" stop-color="#E4D7C3"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8E7B0" stop-opacity=".9"/>
      <stop offset="1" stop-color="#F7F1E7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="inkline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="0.55" stop-color="#1D4E4A"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1.5" r="0.6" fill="#1C1917" opacity=".05"/>
      <circle cx="4.5" cy="4" r="0.5" fill="#1C1917" opacity=".04"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="22" fill="url(#desk)"/>
  <rect width="1200" height="300" rx="22" fill="url(#grain)"/>
  <ellipse cx="980" cy="-20" rx="260" ry="180" fill="url(#sun)"/>

  <!-- desk edge -->
  <path d="M0 246 H1200" stroke="#C4B49A" stroke-width="1.25" opacity=".7"/>
  <path d="M0 252 H1200" stroke="#D8C9B0" stroke-width="6" opacity=".35"/>

  <!-- sparse constellation / sensor graph -->
  <g stroke="#1D4E4A" stroke-width="1.25" fill="none" opacity=".55">
    <path d="M730 78 C780 58 820 118 870 92 S960 54 1010 86 S1090 120 1145 78"/>
    <path d="M760 148 C820 128 860 178 920 156 S1020 120 1088 150"/>
  </g>
  <g fill="#0F766E">
    <circle cx="760" cy="88" r="3.5"/>
    <circle cx="870" cy="92" r="3"/>
    <circle cx="1010" cy="86" r="3.5"/>
    <circle cx="920" cy="156" r="3"/>
    <circle cx="1088" cy="150" r="3"/>
  </g>
  <g stroke="#B45309" stroke-width="1" opacity=".45">
    <path d="M870 92 L920 156"/>
    <path d="M1010 86 L1088 150"/>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" fill="#1C1917">
    <text x="72" y="118" font-size="64" font-weight="700" letter-spacing="-1.5">Hayden Fu</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#3F3A32">
    <text x="76" y="158" font-size="18" letter-spacing="1.5">CS + STATISTICS  ·  CORNELL</text>
    <text x="76" y="198" font-size="15" fill="#1D4E4A">research software for messy systems — models, sensors, forecasts</text>
    <text x="76" y="246" font-size="12" font-weight="700" fill="#7A6A52" letter-spacing="2.5">ITHACA  /  BAY AREA  /  SUMMER 2027</text>
  </g>
</svg>
